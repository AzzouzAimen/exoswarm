[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exoswarm-api"
version = "0.1.0"
description = "ExoSwarm FastAPI and bounded investigation harness scaffold"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
agents = [
  "langgraph>=0.6,<1",
  "openai>=1.100,<3",
]
science = [
  "astropy>=7,<9",
  "httpx>=0.28,<1",
  "lightkurve>=2.5,<3",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "pandas>=2.3,<4",
  "scipy>=1.16,<2",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/exoswarm"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

